# QACT Co-Training Configuration for Moonshine ASR
# Default settings matching the paper's hyperparameters

# Model settings
model-name: usefulsensors/moonshine-base

# Quantization settings
enc-weight-bit: 2
use-scaling: true
quant-mode: symmetric
quant-decoder: false

# QACT co-training hyperparameters
mix-rate: 1.8
lambda-1: 0.5
lambda-2: 1.0

# Training settings
epochs: 100
batch-size: 8
lr: 0.00005
warmup-steps: 1000
grad-clip: 5.0
accum-grad: 1
label-smoothing: 0.1

# Dataset settings
dataset: librispeech_asr
dataset-config: clean
train-split: train.100
num-workers: 4

# Logging and saving
log-interval: 10
save-interval: 1
seed: 42
